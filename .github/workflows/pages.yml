name: Deploy dashboard to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: symbolic_market_instability
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: symbolic_market_instability/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Best effort: produce a fresh S&P 500 run so the published dashboard
      # has real data. If Yahoo Finance is unreachable the export still
      # succeeds with whatever runs exist (possibly none).
      - name: Run analysis (best effort)
        continue-on-error: true
        run: python scripts/run_analysis.py

      - name: Export static dashboard
        run: python scripts/export_static.py --out site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: symbolic_market_instability/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
